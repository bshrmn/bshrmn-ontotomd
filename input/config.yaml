# config.yaml
global_params:
  logging_params:
    logging_level: "DEBUG"  # DEBUG/INFO/WARNING/ERROR/CRITICAL
    logging_file: "c:/Users/bsher/Documents/bshrmn-ontotomd/output/onto-to-md.log"
    max_file_size: 1000000  # File size is in bytes
    backup_count: 5  # The number of log files to retain
  ontologies_directory: "c:/Users/bsher/Documents/bshrmn-ontotomd/ontologies"
  output_directory: "c:/Users/bsher/Documents/bshrmn-ontotomd/output"

preload:
  # Namespaces that will be downloaded locally
  # NOTE: Merged with the defaults in the code
  targets:
    # - "http://www.w3.org/2002/07/owl#"
    # - "http://purl.org/dc/elements/1.1/"
  overwrite_local_files: false

process:
  # The primary ontology to process (XML-like)
  target: "c:/Users/bsher/Documents/bshrmn-ontotomd/input/swo.owl"
  # The namespace for the primary ontology
  target_namespace: "http://www.ebi.ac.uk/swo/"
  # Resources that will not be resolved if seen
  # These will be treated as strings during processing
  skippable_resources:
    - "http://purl.obolibrary.org/obo/RO_0002575"
    - "http://purl.obolibrary.org/obo/RO_0001900"
    - "http://edamontology.org#subset"
    - "http://purl.obolibrary.org/obo/RO_0001901"
    - "http://purl.obolibrary.org/obo/RO_0004050"
    - "http://www.w3.org/2001/XMLSchema#string"
    - "http://purl.obolibrary.org/obo/RO_0004049"
    - "http://www.geneontology.org/formats/oboInOwl#SubsetProperty"
    - "http://www.w3.org/2001/XMLSchema#boolean"
    - "http://www.geneontology.org/formats/oboInOwl#created_by"
    - "http://edamontology.org#namespace"
    - "http://purl.obolibrary.org/obo/RO_0002579"
    - "http://purl.obolibrary.org/obo/RO_0040042"
    - "http://www.geneontology.org/formats/oboInOwl#creation_date"
    - "http://edamontology.org#def"
    - "http://edamontology.org#created_in"
    - "http://www.psidev.info/mif"
    - "http://purl.obolibrary.org/obo/valid_for_go_gp2term"
    - "http://www.geneontology.org/formats/oboInOwl#is_metadata_tag"
    - "http://purl.obolibrary.org/obo/valid_for_go_annotation_extension"
    - "http://purl.obolibrary.org/obo/RO_0002259"
    - "http://purl.obolibrary.org/obo/valid_for_go_ontology"
    - "http://purl.obolibrary.org/obo/valid_for_gocam"
    - "http://swrl.stanford.edu/ontologies/3.3/swrla.owl#isRuleEnabled"
  # Resources in these namespaces will not be resolved if seen
  skippable_namespaces:
    - "http://purl.obolibrary.org/obo/ro/subsets#"
    - "http://protege.stanford.edu/plugins/owl/protege#"
  # Resources that will not have pages made for them
  do_not_create_resources:
    # - "http://www.w3.org/2002/07/owl#Thing"
  # Resources that should be treated as Class types
  # NOTE: Merged with the defaults in the code
  class_types:
    # - "http://www.w3.org/2002/07/owl#Class"
  # Resources that should be treated as Individual types
  # NOTE: Merged with the defaults in the code
  individual_types:
    # - "http://www.w3.org/2002/07/owl#NamedIndividual"
  # Resources that should be treated as Property types
  # NOTE: Merged with the defaults in the code
  property_types:
    # - "http://www.w3.org/2002/07/owl#ObjectProperty"
  # Properties to list as aliases for resources
  # NOTE: Merged with the defaults in the code
  alias_properties:
    - "http://purl.obolibrary.org/obo/IAO_0000111"
    - "http://purl.obolibrary.org/obo/IAO_0000118"
  # Properties to list as descriptions for resources
  # NOTE: Merged with the defaults in the code
  description_properties:
    - "http://purl.obolibrary.org/obo/IAO_0000115"
    - "http://purl.obolibrary.org/obo/IAO_0000119"
    - "http://purl.obolibrary.org/obo/IAO_0000112"
  # Properties to display only as raw links (unresolved)
  # NOTE: Merged with the defaults in the code
  external_link_properties:
    - "http://purl.obolibrary.org/obo/IAO_0000412"
    - "http://purl.obolibrary.org/obo/IAO_0000117"
    - "http://purl.obolibrary.org/obo/IAO_0000119"
    - "http://purl.obolibrary.org/obo/IAO_0010000"
    - "http://purl.obolibrary.org/obo/IAO_0000233"
    - "http://www.geneontology.org/formats/oboInOwl#hasDbXref"
    - "http://www.geneontology.org/formats/oboInOwl#created_by"
    - "http://www.geneontology.org/formats/oboInOwl#inSubset"