[project]
name = "bshrmn-ontotomd"
version = "0.1.0"
description = "A CLI tool for converting ontology graphs into Markdown directories."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.25.1",
  "ruff>=0.15.13",
  "rdflib>=7.6.0",
  "typer-config[yaml]>=1.5.1",
  "pydantic>=2.13.4",
]

[project.scripts]
bshrmn-ontotomd = "bshrmn_ontotomd.main:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
